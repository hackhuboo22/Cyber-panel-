<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPanel</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #0b0b0b; font-family: 'Courier New', monospace; color: #0f0; }
        #login { display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle, #1a1a2e, #0a0a0a); }
        #login form { background: #161616; padding: 40px; border-radius: 12px; border: 1px solid #0f0; box-shadow: 0 0 30px #0f0; }
        #login input { display: block; margin: 10px 0; padding: 12px; background: #222; border: 1px solid #0f0; color: #0f0; width: 250px; }
        #login button { background: #0f0; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        #dashboard { display: none; }
        #sidebar { position: fixed; left:0; top:0; width: 180px; height: 100%; background: #111; border-right: 1px solid #0f0; padding-top: 20px; }
        #sidebar button { display: block; width: 100%; padding: 12px; background: transparent; color: #0f0; border: none; border-bottom: 1px solid #222; text-align: left; font-family: inherit; cursor: pointer; }
        #sidebar button:hover { background: #1f1f1f; }
        #main { margin-left: 180px; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
        #terminal-container { flex: 1; background: #0d0d0d; border: 1px solid #0f0; border-radius: 8px; padding: 10px; overflow: hidden; }
        #terminal { height: 100%; white-space: pre-wrap; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .header button { background: #0f0; color: #000; border: none; padding: 5px 12px; cursor: pointer; }
        #file-panel, #system-panel { display: none; flex:1; background: #0d0d0d; border:1px solid #0f0; border-radius:8px; padding:10px; overflow-y:auto; }
        #file-panel table { width:100%; border-collapse: collapse; color:#0f0; }
        #file-panel th, #file-panel td { padding:8px; border-bottom:1px solid #222; text-align:left; }
        .gauge { background:#222; border-radius:10px; height:20px; width:100%; margin:5px 0; }
        .gauge-fill { background:#0f0; height:100%; border-radius:10px; transition: width 0.3s; }
        input[type="text"] { background:#222; color:#0f0; border:1px solid #0f0; padding:5px; }
        button { background:#0f0; color:#000; border:none; padding:5px 12px; cursor:pointer; }
        #status { color: #0f0; }
    </style>
</head>
<body>
<div id="login">
    <form id="loginForm">
        <h2 style="text-align:center;margin-bottom:20px;">🔐 CyberPanel</h2>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button type="submit">Login</button>
    </form>
</div>

<div id="dashboard">
    <div id="sidebar">
        <button onclick="showPanel('terminal')">🖥️ Terminal</button>
        <button onclick="showPanel('files')">📁 Files</button>
        <button onclick="showPanel('system')">⚙️ System</button>
        <button onclick="logout()">🚪 Logout</button>
    </div>
    <div id="main">
        <div class="header"><span id="status">Ready</span><span id="hostname">localhost</span></div>
        <!-- Terminal -->
        <div id="terminal-container"><pre id="terminal" style="color:#0f0;height:100%;overflow-y:auto;padding:10px;">Welcome to CyberPanel!\nType commands below.\n$ </pre></div>
        <!-- File Manager -->
        <div id="file-panel">
            <div style="margin-bottom:10px;">
                <input type="text" id="filePath" value="." style="width:60%;">
                <button onclick="listFiles()">Go</button>
                <button onclick="document.getElementById('fileUpload').click()">Upload</button>
                <input type="file" id="fileUpload" style="display:none" onchange="uploadFile()">
            </div>
            <div id="fileList"></div>
        </div>
        <!-- System Info -->
        <div id="system-panel">
            <h3>CPU</h3><div class="gauge"><div class="gauge-fill" id="cpuGauge" style="width:0%"></div></div>
            <h3>RAM</h3><div class="gauge"><div class="gauge-fill" id="ramGauge" style="width:0%"></div></div>
            <h3>Disk</h3><div class="gauge"><div class="gauge-fill" id="diskGauge" style="width:0%"></div></div>
            <pre id="sysDetails" style="margin-top:10px;"></pre>
            <button onclick="getSystemInfo()">Refresh</button>
        </div>
    </div>
</div>

<script>
    let loggedIn = false;

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({username, password})
        });
        if (res.ok) {
            document.getElementById('login').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loggedIn = true;
            document.getElementById('status').innerText = '✅ Connected';
            listFiles();
            getSystemInfo();
        } else {
            alert('Login failed');
        }
    });

    function logout() {
        fetch('/logout', {method:'POST'});
        location.reload();
    }

    // Terminal Logic
    document.addEventListener('keydown', async (e) => {
        const term = document.getElementById('terminal');
        if (e.target.tagName === 'INPUT') return;
        if (!loggedIn) return;
        if (e.key === 'Enter') {
            const text = term.innerText;
            const lines = text.split('\n');
            const lastLine = lines[lines.length - 1];
            const cmd = lastLine.startsWith('$ ') ? lastLine.slice(2) : lastLine;
            if (cmd.trim()) {
                term.innerText += '\n';
                const res = await fetch('/exec', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({cmd: cmd.trim()})
                });
                const data = await res.json();
                term.innerText += data.output + '\n$ ';
            } else {
                term.innerText += '\n$ ';
            }
            term.scrollTop = term.scrollHeight;
            e.preventDefault();
        } else if (e.key === 'Backspace') {
            const text = term.innerText;
            if (text.endsWith('$ ')) return;
            term.innerText = text.slice(0, -1);
            e.preventDefault();
        } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
            const text = term.innerText;
            if (text.endsWith('$ ')) {
                term.innerText = text + e.key;
            } else {
                term.innerText += e.key;
            }
            e.preventDefault();
        }
    });

    // Files
    async function listFiles() {
        const path = document.getElementById('filePath').value || '.';
        const res = await fetch(`/files?path=${encodeURIComponent(path)}`);
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        let html = `<table><tr><th>Name</th><th>Size</th><th>Modified</th><th>Actions</th></tr>`;
        data.files.forEach(f => {
            html += `<tr><td>${f.is_dir ? '📁' : '📄'} ${f.name}</td>
                     <td>${f.is_dir ? '-' : (f.size/1024).toFixed(1)} KB</td>
                     <td>${new Date(f.modified*1000).toLocaleString()}</td>
                     <td><button onclick="deleteFile('${path}/${f.name}')">Delete</button></td></tr>`;
        });
        html += '</table>';
        document.getElementById('fileList').innerHTML = html;
    }

    function deleteFile(path) {
        if (!confirm(`Delete ${path}?`)) return;
        fetch('/delete', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({path})
        }).then(() => listFiles());
    }

    async function uploadFile() {
        const file = document.getElementById('fileUpload').files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        formData.append('path', document.getElementById('filePath').value || '.');
        await fetch('/upload', {method:'POST', body:formData});
        listFiles();
    }

    // System Info
    async function getSystemInfo() {
        const res = await fetch('/system');
        const data = await res.json();
        if (data.error) { document.getElementById('sysDetails').innerText = data.error; return; }
        document.getElementById('cpuGauge').style.width = data.cpu + '%';
        document.getElementById('ramGauge').style.width = data.memory.percent + '%';
        document.getElementById('diskGauge').style.width = data.disk.percent + '%';
        document.getElementById('sysDetails').innerText = 
            `CPU: ${data.cpu}%\nRAM: ${(data.memory.used/1e9).toFixed(1)} GB / ${(data.memory.total/1e9).toFixed(1)} GB\nDisk: ${(data.disk.used/1e9).toFixed(1)} GB / ${(data.disk.total/1e9).toFixed(1)} GB\nNetwork Sent: ${(data.network.sent/1e6).toFixed(1)} MB\nNetwork Recv: ${(data.network.recv/1e6).toFixed(1)} MB`;
    }

    function showPanel(panel) {
        document.getElementById('terminal-container').style.display = panel === 'terminal' ? 'block' : 'none';
        document.getElementById('file-panel').style.display = panel === 'files' ? 'block' : 'none';
        document.getElementById('system-panel').style.display = panel === 'system' ? 'block' : 'none';
        if (panel === 'files') listFiles();
        if (panel === 'system') getSystemInfo();
    }
    // Default show terminal
    showPanel('terminal');
</script>
</body>
</html>
